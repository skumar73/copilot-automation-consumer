name: module-update-check

# Thin caller. Real logic in the producer repo. Skip this workflow entirely
# if your org runs Renovate (which handles OCI tag bumps centrally via the
# config in <org>/.github/renovate.json).

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: adusa/agentic-automation-producer/.github/workflows/consumer-module-update-check.yml@v1
    secrets: inherit
