name: deploy

# Thin caller. The actual logic lives in the producer repo so platform-team
# updates apply to every consumer at once. See:
# <org>/agentic-automation-producer/.github/workflows/consumer-deploy.yml

on:
  pull_request:
    paths:
      - 'main.bicep'
      - 'parameters/**'
      - 'bicepconfig.json'
      - '.github/workflows/deploy.yml'
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    uses: adusa/agentic-automation-producer/.github/workflows/consumer-deploy.yml@v1
    secrets: inherit
